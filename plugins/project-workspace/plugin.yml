name: project-workspace
version: 1.0.0
type: command
category: development
description: Create and manage structured project workspaces for development tasks
author: jeff-roche

long_description: |
  The project-workspace commands help you create and resume structured project
  workspaces for specific development tasks. Each project gets its own directory
  with task-specific scaffolding (bug investigation, feature development, CI/testing,
  documentation, or analysis). Supports JIRA integration, progress tracking, and
  automatic context loading from multi-repo workspaces.

homepage: https://github.com/jeff-roche/edge-tooling/tree/main/plugins/project-workspace
license: Apache-2.0
tags:
  - project-management
  - workspace
  - task-tracking
  - jira
  - bug-investigation
  - feature-development

compatibility:
  claude_code_min: "1.0.0"
  required_tools: []
  platforms: ["linux", "darwin"]

dependencies:
  plugins: []
  optional_plugins: ["dev-env-setup"]

install:
  commands:
    - name: new
      file: new.md
    - name: resume
      file: resume.md
  post_install: null

usage:
  trigger_keywords:
    - "new project"
    - "create workspace"
    - "resume project"
    - "bug investigation"
    - "feature development"
  examples:
    - "/project:new Fix kubelet timeout issue"
    - "/project:new"
    - "/project:resume OCPBUGS-12345"
    - "/project:resume 1"
    - "/project:resume"

changelog:
  - version: 1.0.0
    date: 2026-03-23
    changes:
      - "Initial release"
      - "Support for 5 project types (bug, feature, ci-testing, docs, analysis)"
      - "JIRA integration"
      - "Progress tracking with checklists"
      - "Auto-loading repo context from dev-env workspaces"
      - "Numeric shorthand for quick resume"
