apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-cve-scanner
  namespace: edge-cve-scans
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edge-cve-scanner
  namespace: edge-cve-scans
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edge-cve-scanner
  namespace: edge-cve-scans
subjects:
  - kind: ServiceAccount
    name: edge-cve-scanner
    namespace: edge-cve-scans
roleRef:
  kind: Role
  name: edge-cve-scanner
  apiGroup: rbac.authorization.k8s.io
