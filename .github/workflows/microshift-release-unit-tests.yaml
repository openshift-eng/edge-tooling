name: MicroShift Release Unit Tests

on:
  pull_request:
    paths:
      - 'plugins/microshift-release/scripts/**'
      - 'plugins/microshift-release/skills/**'
      - '.github/workflows/microshift-release-unit-tests.yaml'
  push:
    branches: [main]
    paths:
      - 'plugins/microshift-release/scripts/**'
      - 'plugins/microshift-release/skills/**'
      - '.github/workflows/microshift-release-unit-tests.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    defaults:
      run:
        working-directory: plugins/microshift-release/scripts
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: plugins/microshift-release/scripts/requirements*.txt

      - name: Install Kerberos build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run Python unit tests (network disabled)
        run: python -m pytest unit_tests/ -q

      - name: Run shell unit tests
        run: bash unit_tests/test_request_art_builds.sh
